<svg width="2256" height="840" viewBox="0 0 1128 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1A4E"/>
      <stop offset="45%" stop-color="#252368"/>
      <stop offset="100%" stop-color="#2E2B80"/>
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0E9B6C"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B942"/>
      <stop offset="100%" stop-color="#E8A020"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1128" height="420" fill="url(#bgGradient)"/>

  <!-- Decorative diagonal light streaks (extended to full height) -->
  <polygon points="700,0 830,0 620,420 490,420" fill="#FFFFFF" opacity="0.025"/>
  <polygon points="860,0 940,0 730,420 650,420" fill="#FFFFFF" opacity="0.02"/>
  <polygon points="990,0 1050,0 840,420 780,420" fill="#0E9B6C" opacity="0.05"/>

  <!-- Subtle grid dots pattern (right side) -->
  <g fill="#FFFFFF" opacity="0.08">
    <circle cx="900" cy="60" r="2"/><circle cx="930" cy="60" r="2"/><circle cx="960" cy="60" r="2"/><circle cx="990" cy="60" r="2"/><circle cx="1020" cy="60" r="2"/><circle cx="1050" cy="60" r="2"/><circle cx="1080" cy="60" r="2"/>
    <circle cx="900" cy="90" r="2"/><circle cx="930" cy="90" r="2"/><circle cx="960" cy="90" r="2"/><circle cx="990" cy="90" r="2"/><circle cx="1020" cy="90" r="2"/><circle cx="1050" cy="90" r="2"/><circle cx="1080" cy="90" r="2"/>
    <circle cx="900" cy="120" r="2"/><circle cx="930" cy="120" r="2"/><circle cx="960" cy="120" r="2"/><circle cx="990" cy="120" r="2"/><circle cx="1020" cy="120" r="2"/><circle cx="1050" cy="120" r="2"/><circle cx="1080" cy="120" r="2"/>
  </g>

  <!-- Echoed arrow shapes (low opacity, right side) -->
  <g opacity="0.10" transform="translate(940, 210) scale(0.9)">
    <path d="M 20 0 L 90 0 Q 100 0 100 10 L 100 40 Q 100 50 90 50 L 20 50 L 35 25 Z" fill="#0E9B6C"/>
  </g>
  <g opacity="0.08" transform="translate(1010, 250) scale(0.7)">
    <path d="M 80 0 L 10 0 Q 0 0 0 10 L 0 40 Q 0 50 10 50 L 80 50 L 65 25 Z" fill="#FFFFFF"/>
  </g>

  <!-- Content shifted down ~115px to vertically center in taller canvas -->
  <g transform="translate(0, 115)">
    <!-- Logo mark (left) -->
    <g transform="translate(60, 30)">
      <path d="M 10 8 L 58 8 Q 64 8 64 14 L 64 46 Q 64 52 58 52 L 10 52 L 22 30 Z" fill="url(#greenGradient)"/>
      <path d="M 76 8 L 124 8 L 112 30 L 124 52 L 76 52 Q 70 52 70 46 L 70 14 Q 70 8 76 8 Z" fill="#FFFFFF"/>
      <path d="M 56 56 L 67 48 L 78 56 L 78 64 L 56 64 Z" fill="url(#goldGradient)"/>
      <rect x="56" y="64" width="22" height="66" rx="5" fill="url(#greenGradient)"/>
    </g>

    <!-- Divider line -->
    <rect x="230" y="45" width="3" height="100" rx="1.5" fill="url(#goldGradient)" opacity="0.8"/>

    <!-- Brand name -->
    <text x="270" y="95" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="10">TIJARAH</text>

    <!-- Tagline -->
    <text x="273" y="133" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#10B981" letter-spacing="3.5">YOUR B2B &amp; B2C MARKETPLACE</text>

    <!-- Gold accent underline -->
    <rect x="273" y="145" width="180" height="3" rx="1.5" fill="url(#goldGradient)"/>

    <!-- Website URL (bottom right) -->
    <text x="1068" y="172" text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" opacity="0.75" letter-spacing="1.5">tijarah.pk</text>
  </g>

  <!-- Top and bottom accent bars -->
  <rect x="0" y="0" width="1128" height="4" fill="url(#greenGradient)"/>
  <rect x="0" y="416" width="1128" height="4" fill="url(#goldGradient)"/>
</svg>
