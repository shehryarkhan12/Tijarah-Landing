<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unsubscribed — Tijarah</title>
  <meta name="robots" content="noindex" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020d08;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #04160e;
      border: 1px solid #0d3b26;
      border-radius: 20px;
      padding: 44px 36px;
      text-align: center;
    }
    .logo {
      width: 56px; height: 56px;
      border-radius: 14px;
      border: 1px solid #0d3b26;
      margin-bottom: 20px;
    }
    .bar {
      width: 56px; height: 3px;
      background: #34d399;
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    h1 { font-size: 24px; margin-bottom: 12px; }
    p { font-size: 14px; line-height: 1.7; color: #a7b8ad; margin-bottom: 10px; }
    a.cta {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 30px;
      background: #34d399;
      color: #020d08;
      font-weight: 700;
      font-size: 14px;
      border-radius: 12px;
      text-decoration: none;
    }
    .fine { font-size: 11px; color: #4a5d52; margin-top: 22px; }
    .fine a { color: #4a5d52; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="Tijarah" />
    <div class="bar"></div>
    <h1>You're unsubscribed</h1>
    <p>
      You've been removed from the Tijarah launch waitlist and won't
      receive any more updates.
    </p>
    <p>Changed your mind? You can rejoin anytime.</p>
    <a class="cta" href="https://tijarah.pk">Back to tijarah.pk</a>
    <p class="fine">
      Something not right? <a href="mailto:support@tijarah.pk">support@tijarah.pk</a>
    </p>
  </div>
</body>
</html>
